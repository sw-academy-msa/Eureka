# 로컬은 peer 없이 독립 실행하며 자기 자신에게 등록 요청을 보내지 않습니다.
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  config:
    # 로컬 수집 토큰만 가져오며 운영 비밀값은 외부에서 주입합니다.
    import: optional:file:./.env[.properties]

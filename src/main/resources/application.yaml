# 환경 공통 설정이며 운영 노드 정보는 prod 프로필에서 주입합니다.
spring:
  application:
    name: eureka-server
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8761
  shutdown: graceful

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

eureka:
  server:
    # 네트워크 단절 때 정상 인스턴스를 대량 제거하지 않도록 유지합니다.
    enable-self-preservation: true

# 업무 JWT와 분리된 읽기 전용 수집 토큰입니다. 빈 값이면 메트릭 접근을 거부합니다.
monitoring:
  scrape-token: ${MONITORING_SCRAPE_TOKEN:}

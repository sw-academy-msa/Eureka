# PR과 main 변경 시 Java 21로 테스트하고 배포용 실행 JAR과 Docker 이미지 빌드를 검증합니다. AWS 배포는 실행하지 않습니다.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        run: chmod +x gradlew && ./gradlew clean test bootJar --no-daemon
      # ECS 등 컨테이너 배포에 쓰는 Dockerfile이 깨지지 않았는지 확인만 하고 레지스트리에 올리지 않습니다.
      - name: Build Docker image
        run: docker build -t stockdrop-eureka:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eureka-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
